# WIP — Budi, Sep 2026
# Apply live/ from Actions. Not reviewed. Not used for a real change.
#
# Took this off push-to-main — it failed on every commit (missing keys, missing
# branch). Manual only until someone finishes it. Do not turn auto-apply back on.
name: Apply infrastructure

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: "budi/apply-wip"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Apply everything
        run: |
          cd live
          terragrunt run-all apply --terragrunt-non-interactive
