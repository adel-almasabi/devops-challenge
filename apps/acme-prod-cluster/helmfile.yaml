helmDefaults:
  kubeContext: arn:aws:eks:ap-southeast-3:111111111111:cluster/acme-prod
  wait: true
  timeout: 600

repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: autoscaler
    url: https://kubernetes.github.io/autoscaler

releases:
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.11.2
    values:
      - values/ingress-nginx.yaml

  - name: keda
    namespace: keda
    chart: kedacore/keda
    version: 2.15.1
    values:
      - values/keda.yaml

  - name: cluster-autoscaler
    namespace: kube-system
    chart: autoscaler/cluster-autoscaler
    version: 9.37.0
    values:
      - values/cluster-autoscaler.yaml

  - name: claims-worker
    namespace: claims
    chart: ../../charts/service
    values:
      - values/claims-worker.yaml
